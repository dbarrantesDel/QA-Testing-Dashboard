<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA &amp; Testing Knowledge Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --link:#005E86; --green:#86BC25; --green-h:#6B9A1E; --green-dk:#046A38;
  --charcoal:#26292B; --ink:#1B1B1B; --ink2:#3A3B3C; --muted:#595959;
  --page:#F1F2F2; --card:#FFFFFF; --line:#D9DADB; --line2:#B5B7B9;
  --amber:#E8A317; --red:#DA291C; --blue:#0076A8; --blue-bg:#E1F0F7;
  --ph-bg:#FFF6E0; --ph-ink:#5B3F00;
  --side:288px; --top:56px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 16px)}
body{margin:0;font-family:'Open Sans',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:var(--ink);background:var(--page)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .6rem;color:var(--ink)}
h1{font-size:1.8rem;font-weight:700;margin-bottom:1rem}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700;margin-top:1.1rem}
h4{font-size:.95rem;font-weight:700}
p{margin:.5rem 0}
a{color:var(--link)}
a:hover{color:#00425c}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.85rem} .lead{font-size:1.02rem;max-width:78ch}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.topbar :focus-visible,.sidebar :focus-visible{outline-color:var(--green)}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--ink);padding:.5rem .8rem;z-index:100;border-radius:4px}
.skip:focus{left:8px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:1rem;padding:0 1rem;background:var(--charcoal);color:#fff}
.brand{display:flex;align-items:center;gap:.65rem;color:#fff;text-decoration:none;min-width:0}
.brand:hover{color:#fff}
.logo{width:14px;height:34px;background:var(--green);border-radius:2px;flex:none}
.brand strong{font-size:1.1rem} .brand span span{color:#D9DADB;font-size:.9rem;margin-left:.3rem}
.menubtn{display:none;background:transparent;color:#fff;border:1px solid #8A8C8E;border-radius:4px;padding:.35rem .7rem;font:inherit;cursor:pointer}
.search{position:relative;margin-left:auto;width:min(420px,48vw)}
.search input{width:100%;padding:.5rem .75rem;border:2px solid transparent;border-radius:4px;font:inherit;background:#fff;color:var(--ink)}
.search input:focus{border-color:var(--green);outline:none}
#sres{position:absolute;right:0;left:0;top:calc(100% + 6px);margin:0;padding:.25rem;list-style:none;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:min(70vh,520px);overflow:auto;z-index:50}
#sres li{padding:.5rem .6rem;border-radius:4px;cursor:pointer;display:grid;gap:.1rem}
#sres li[aria-selected="true"]{background:#EAF4D6;outline:2px solid var(--green)}
.srt{font-weight:700}.srp{font-size:.78rem;color:var(--muted)}.srs{font-size:.82rem;color:var(--ink2)}
.srs mark{background:#FDF1D3;color:var(--ink)}
.srnone{cursor:default!important}

/* layout */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
.sidebar{background:var(--charcoal);color:#fff;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:1rem .9rem 2rem}
.sidebar a{color:#fff;text-decoration:none;display:block;padding:.38rem .6rem;border-left:4px solid transparent;border-radius:0 4px 4px 0}
.sidebar a:hover{background:#3A3E41}
.sidebar a[aria-current="page"]{border-left-color:var(--green);background:#3A3E41;font-weight:700}
.startbox{background:#33373A;border-radius:6px;padding:.8rem;margin-bottom:1rem}
.startbox label{font-weight:700;display:block;margin-bottom:.35rem}
.startbox select{width:100%;padding:.45rem;border-radius:4px;border:1px solid var(--line2);font:inherit}
.startbox ol{margin:.6rem 0 0;padding-left:1.4rem}
.startbox li{margin:.1rem 0}
.startbox li a{padding:.2rem .4rem;display:inline-block;border-left:0}
.navgroup{margin-bottom:.9rem}
.navlabel{font-size:.82rem;color:#C4C6C8;margin:0 0 .25rem .6rem;font-weight:600}
.sidebar ul{list-style:none;margin:0;padding:0}
.main{padding:1.4rem 1.6rem 3rem;max-width:1180px;width:100%;min-width:0}
.databanner{border-left:5px solid var(--blue);background:var(--blue-bg);padding:.55rem .85rem;border-radius:4px;margin-bottom:1rem;font-size:.88rem}
.databanner.imported{border-color:var(--green);background:#EAF4D6}
.databanner a{font-weight:600}

/* cards and grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.25rem;margin:0 0 1.1rem}
.card.off{background:#F7F7F7}
.card.target{outline:3px solid var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1rem}
.panel{border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;background:#FAFAFA}
.panel h3{margin-top:0}
.panel.off{opacity:.8}
.stat .big{font-size:1.7rem;font-weight:700;line-height:1.1}
.stat{border-left:5px solid var(--green)}
.cycles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-bottom:.5rem}
.cyclecard{border:1px solid var(--line);border-top:5px solid var(--green);border-radius:6px;padding:.8rem .95rem;background:#fff}
.cyclecard.off{border-top-color:var(--line2);background:#F7F7F7}
.cyclecard h3{margin:0}
.kv{margin:.55rem 0;padding-top:.5rem;border-top:1px solid var(--line)}
.kv .k{font-size:.82rem;color:var(--muted);font-weight:600}
.facts{margin:.6rem 0;display:grid;gap:.15rem}
.facts div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:.75rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.facts dt{font-weight:600;color:var(--ink2)} .facts dd{margin:0}
.links{list-style:none;padding:0;margin:.4rem 0 0}.links li{margin:.25rem 0}
ul.plain{padding-left:1.2rem}ul.plain li{margin:.3rem 0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.2rem .7rem;align-items:start;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px}
ol.steps li::before{content:counter(s);grid-row:span 2;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--green);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center}
ol.steps li span{color:var(--ink2)}
ol.flow{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;padding:0;margin:.5rem 0 1rem}
ol.flow li{border:2px solid var(--charcoal);border-radius:4px;padding:.25rem .7rem;font-weight:700;background:#fff}
ol.flow li+li::before{content:"\2192";margin-right:.5rem;font-weight:400}
ol.flow li:first-child{border-color:var(--green)}

/* buttons, chips, fields */
.btn{display:inline-block;background:var(--green);color:var(--ink);font:inherit;font-weight:600;border:2px solid var(--green);border-radius:4px;padding:.5rem 1rem;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--green-h);border-color:var(--green-h);color:var(--ink)}
.btn.secondary{background:#fff;border-color:var(--charcoal)}
.btn.secondary:hover{background:#E6E7E8;border-color:var(--charcoal)}
.btn.disabled,.btn:disabled{background:#E1E2E3;border-color:#E1E2E3;color:var(--muted);cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--link);text-decoration:underline;cursor:pointer;text-align:left}
.linkbtn.strong{font-weight:700}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.25rem}
input[type=text],input[type=search],input[type=number],input[type=url],select{width:100%;min-width:0;padding:.45rem .55rem;border:1px solid var(--line2);border-radius:4px;font:inherit;background:#fff;color:var(--ink)}
input[type=file]{font:inherit;max-width:100%}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;align-items:end;margin:.6rem 0}
.check{display:flex;align-items:center;gap:.5rem}.check label{margin:0;font-weight:400}
.check input{width:1.1rem;height:1.1rem}
.inline-field{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}
.chip{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--line2);background:#EDEEEF;color:var(--ink2);white-space:nowrap}
.chip.ok{background:#EAF4D6;border-color:var(--green);color:#1D4D00}
.chip.warn{background:#FDF1D3;border-color:var(--amber);color:var(--ph-ink)}
.chip.info{background:var(--blue-bg);border-color:var(--blue);color:#004E70}
.chip.dark{background:#2B2B2B;border-color:#2B2B2B;color:#fff}
.rag{display:inline-flex;align-items:center;gap:.4rem;padding:.05rem .6rem;border-radius:4px;font-weight:700;font-size:.85rem;border:1px solid var(--line2);background:#EDEEEF;color:var(--ink)}
.rag i{width:.7rem;height:.7rem;border-radius:50%;display:inline-block;background:#8A8C8E}
.rag-green{background:#EAF4D6;border-color:var(--green)}.rag-green i{background:var(--green)}
.rag-amber{background:#FDF1D3;border-color:var(--amber)}.rag-amber i{background:var(--amber)}
.rag-red{background:#FBE3E1;border-color:var(--red)}.rag-red i{background:var(--red)}
.rag-none i{background:#fff;border:2px solid #8A8C8E}
.ragline{display:block;margin-top:.25rem}
.ph{border:1px dashed #B26A00;background:var(--ph-bg);color:var(--ph-ink);padding:0 .4rem;border-radius:3px;font-size:.92em;font-style:normal}
.na{font-weight:700;color:var(--ph-ink)}
.reason{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.rate strong{font-size:1.1rem}.den{color:var(--ink2);font-size:.88rem}
.denl{display:block;font-size:.78rem;color:var(--muted)}
.errtext{color:#9A1B12;font-weight:600}
.req{font-size:.72rem;font-weight:700;color:#9A1B12}
.assump{display:inline-block;font-size:.72rem;font-weight:600;color:#004E70;background:var(--blue-bg);border:1px solid var(--blue);border-radius:3px;padding:0 .35rem;text-decoration:none;white-space:nowrap}
.tip{border-bottom:1px dotted var(--ink2);cursor:help;position:relative;font-weight:600}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:max-content;max-width:280px;background:var(--charcoal);color:#fff;padding:.45rem .6rem;border-radius:4px;font-size:.8rem;font-weight:400}
.callout{border-left:5px solid var(--blue);background:var(--blue-bg);padding:.7rem 1rem;border-radius:4px;margin:0 0 1.1rem}
.callout p{margin:.3rem 0 0}.callout strong{display:block}
.callout.key{border-color:var(--green);background:#EAF4D6}
.callout.warn{border-color:var(--amber);background:#FDF1D3}
.callout.ok{border-color:var(--green);background:#EAF4D6}

/* tables */
.tablewrap{overflow-x:auto;position:relative;margin:.6rem 0;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
th,td{padding:.55rem .65rem;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
thead th{background:#F1F2F2;border-bottom:2px solid var(--charcoal);font-weight:700;white-space:normal}
tbody th{font-weight:400;background:#fff}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
table.wide{min-width:880px}
table.matrix th:first-child,table.matrix td:first-child{position:sticky;left:0;background:#fff;min-width:240px;z-index:1}
table.matrix thead th:first-child{background:#F1F2F2}
table.matrix td{text-align:center}
table.matrix th:not(:first-child){min-width:112px}
.dot{display:inline-block;width:.95rem;height:.95rem;border-radius:50%;border:2px solid var(--charcoal);vertical-align:middle}
.dot.full{background:var(--green)}.dot.half{background:#fff}
.legend{font-size:.85rem}
.kpigrid td{min-width:150px}

/* tabs, accordions */
.tabs{margin-bottom:1rem}
[role=tablist]{display:flex;flex-wrap:wrap;gap:.25rem;border-bottom:2px solid var(--charcoal);margin-bottom:1rem}
.tab{font:inherit;font-weight:600;padding:.6rem 1rem;border:2px solid transparent;border-bottom:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:4px 4px 0 0}
.tab:hover{background:#E6E7E8}
.tab[aria-selected=true]{background:#fff;color:var(--ink);border-color:var(--charcoal);border-bottom:4px solid var(--green);margin-bottom:-2px}
.tabpanel>.card:last-child{margin-bottom:0}
details.acc{border:1px solid var(--line);border-radius:4px;margin:.5rem 0;background:#fff}
details.acc>summary{cursor:pointer;padding:.55rem .8rem;font-weight:600;list-style:none;display:flex;gap:.5rem}
details.acc>summary::before{content:"+";font-weight:700;width:1rem}
details.acc[open]>summary::before{content:"\2212"}
details.acc>summary::-webkit-details-marker{display:none}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
.accbody{padding:.6rem .8rem}
details.acc.small{font-size:.88rem}
.item[hidden]{display:none}

/* glossary, lists */
.gloss{margin:0}
.gl{padding:.55rem 0;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:700}.gloss dd{margin:.1rem 0 0}
ul.checklist{list-style:none;padding:0}
ul.checklist li{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0}
ul.checklist input{width:1.15rem;height:1.15rem;margin-top:.2rem}
ul.checklist label{font-weight:400;font-size:.95rem;margin:0}
ul.assumptions{padding:0;list-style:none}
ul.assumptions li{padding:.5rem 0;border-bottom:1px solid var(--line)}
ul.assumptions strong{display:inline-block;min-width:3.2rem}
.idlist{columns:3;padding-left:1.2rem;font-size:.88rem}
.warnlist li{color:var(--ph-ink)}
pre.tplbody{white-space:pre-wrap;word-break:break-word;background:#F7F7F7;border:1px solid var(--line);border-radius:4px;padding:.8rem;font-family:Consolas,'Courier New',monospace;font-size:.82rem;line-height:1.5;margin:.5rem 0}
.tpl h3{margin-top:0}

/* charts and diagram */
.chartbox{position:relative;height:300px;margin:.5rem 0}
.chartbox.tall{height:240px}
.tracewrap{overflow-x:auto;margin:.5rem 0}
svg.trace{width:100%;min-width:760px;height:auto;display:block}
.trace .node{cursor:pointer}
.trace .node rect{fill:#fff;stroke:var(--charcoal);stroke-width:2}
.trace .node.selected rect{fill:var(--green)}
.trace .node:hover rect{stroke-width:4}
.trace .nlabel{font-size:16px;font-weight:700;fill:var(--ink)}
.trace .nsys{font-size:13px;fill:var(--ink2)}
.trace .edge{stroke:#595959;stroke-width:2;fill:none}
.trace .dashed{stroke-dasharray:6 5}
.trace .arrowhead{fill:#595959}
.trace .marker{cursor:pointer}
.trace .marker circle{fill:#fff;stroke:var(--red);stroke-width:3}
.trace .marker:hover circle{fill:#FBE3E1}
.trace .mcount{font-size:14px;font-weight:700;fill:var(--ink)}
.trace .mlabel{font-size:12px;fill:var(--ink)}
.trace g:focus{outline:none}
.trace g:focus-visible rect,.trace g:focus-visible circle{stroke:var(--blue);stroke-width:5}
.calc .result{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:4px;padding:.6rem .9rem;margin:.6rem 0;background:#fff}
.calc .result.na-box{border-left-color:var(--amber)}

/* dialog, toast */
dialog{border:0;border-radius:8px;padding:0;width:min(780px,94vw);max-height:86vh;box-shadow:0 12px 48px rgba(0,0,0,.4);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.modal-in{padding:1.2rem 1.5rem;max-height:84vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.5rem}
.modal-head h2{margin:0}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:.65rem 1.1rem;border-radius:6px;z-index:80;max-width:90vw;border-left:5px solid var(--green)}

#print-area{display:none}
.chk{list-style:none;padding:0}.chk li{margin:.4rem 0;display:flex;gap:.6rem}
.box{display:inline-block;width:1rem;height:1rem;border:2px solid #000;flex:none;margin-top:.15rem}

/* responsive */
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menubtn{display:inline-block}
  .sidebar{position:fixed;z-index:40;left:0;top:var(--top);width:min(320px,88vw);transform:translateX(-102%);visibility:hidden}
  body.nav-open .sidebar{transform:none;visibility:visible}
  .brand span span{display:none}
  .search{width:auto;flex:1}
  .main{padding:1rem}
  .facts div{grid-template-columns:1fr;gap:0}
  .idlist{columns:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* print */
@media print{
  body{background:#fff;font-size:11pt}
  .topbar,.sidebar,.databanner,.no-print,#toast,.skip{display:none!important}
  .shell{display:block}.main{padding:0;max-width:none}
  .card{border:0;padding:0;break-inside:avoid}
  .tablewrap{overflow:visible;border:0}
  details.acc>.accbody{display:block}
  body.print-one .topbar,body.print-one .shell,body.print-one dialog{display:none!important}
  body.print-one #print-area{display:block}
  #print-area h1{font-size:18pt}
  a{color:#000;text-decoration:none}
}

</style>
</head>
<body>
<a class="skip" href="#page-title">Skip to main content</a>
<header class="topbar">
  <button type="button" class="menubtn" id="menu-btn" aria-expanded="false" aria-controls="sidebar">Menu</button>
  <a class="brand" href="#/home"><span class="logo" aria-hidden="true"></span><span><strong id="brand-name"></strong> <span id="brand-sub"></span></span></a>
  <div class="search" role="search">
    <label for="q" class="sr-only">Search all pages</label>
    <input id="q" type="search" placeholder="Search all pages" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sres" aria-autocomplete="list">
    <ul id="sres" role="listbox" aria-label="Search results" hidden></ul>
    <div id="search-status" class="sr-only" role="status" aria-live="polite"></div>
  </div>
</header>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Site navigation">
    <div class="startbox">
      <label for="role">Start here: I am a</label>
      <select id="role"></select>
      <div id="rolepath"></div>
    </div>
    <nav id="nav" aria-label="Pages"></nav>
  </aside>
  <main id="main" class="main">
    <div id="databanner" role="status"></div>
    <h1 id="page-title" tabindex="-1"></h1>
    <div id="content"></div>
    <noscript><p>This portal needs JavaScript to display its content.</p></noscript>
  </main>
</div>
<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-in">
    <div class="modal-head"><h2 id="modal-title"></h2><button type="button" class="btn secondary" id="modal-close">Close</button></div>
    <div id="modal-body"></div>
  </div>

tely.","Attach a screenshot or log that shows the problem.","Link the defect to the failed script and the user story.","Set severity from the business impact, not from how hard the fix looks.","Log one problem per defect."]},"traceability":{"nodes":[{"id":"story","label":"User story","system":"Jira","text":"The requirement or change that the test is meant to prove.","fields":["Story key","Module","Process","RICE ID"]},{"id":"script","label":"Test script","system":"ALM","alm":true,"text":"The scripted steps and expected results that cover a story.","fields":["Test ID","Story key","Cycle"]},{"id":"execution","label":"Execution","system":"ALM","alm":true,"text":"One run of a script by a named tester in a cycle.","fields":["Test ID","Cycle","Attempt number","Executed on"]},{"id":"result","label":"Result","system":"ALM","alm":true,"text":"Passed, Failed, Blocked, Not Run, In Progress or Not Applicable.","fields":["Result status","Evidence"]},{"id":"defect","label":"Defect","system":"{{defectSource}}","text":"A logged problem linked to the failed or blocked script and to its story.","fields":["Defect ID","Test ID","Story key","Severity","Priority"]}],"gaps":[{"id":"g1","title":"Stories without scripts","from":"story","to":"script","text":"A story has no linked test script, so nothing proves it works.","fix":"Write or link a script, or mark the story out of scope with approval."},{"id":"g2","title":"Failed tests without defects","from":"result","to":"defect","text":"A script failed but no defect explains why.","fix":"Log a defect and link it to the script, or record a documented disposition."},{"id":"g3","title":"Defects without stories","from":"defect","to":"story","text":"A defect cannot be traced back to the requirement it affects.","fix":"Link the defect to the correct story, or log a new story for gaps in the requirements."},{"id":"g4","title":"Missing process, module or RICE mapping","from":"script","to":"story","text":"Records without these fields cannot be grouped, filtered or routed to an owner.","fix":"Add the missing fields in the source system and re-load the data."}]},"kpis":[{"id":"execution_pct","name":"Execution %","definition":"Share of planned, applicable scripts that have been executed to a result.","numerator":"Passed + Failed + Blocked","denominator":"Passed + Failed + Blocked + Not Run + In Progress","exclusions":"Not Applicable scripts are excluded from the denominator.","source":"Test execution records (Jira, Excel fallback, or ALM adapter required)","cycles":["fut_tut","sit","uat","regression"],"inputs":[{"key":"passed","label":"Passed"},{"key":"failed","label":"Failed"},{"key":"blocked","label":"Blocked"},{"key":"notRun","label":"Not Run"},{"key":"inProgress","label":"In Progress"},{"key":"notApplicable","label":"Not Applicable"}],"assumption":"A-04","outputs":[{"id":"execution_pct","label":"Execution %","num":["passed","failed","blocked"],"den":["passed","failed","blocked","notRun","inProgress"],"scale":100,"unit":"%","capped":true,"denLabel":"Passed + Failed + Blocked + Not Run + In Progress","thresholdKey":"execution_pct"}]},{"id":"result_rates","name":"Pass / Fail / Block rate","definition":"Share of executed results that are Passed, Failed or Blocked. Reported separately for each cycle.","numerator":"Count of the result being measured","denominator":"Passed + Failed + Blocked","exclusions":"Not Run, In Progress and Not Applicable are excluded. Not Run and Not Applicable are never counted as Passed.","source":"Test execution records (Jira, Excel fallback, or ALM adapter required)","cycles":["fut_tut","sit","uat","regression"],"inputs":[{"key":"passed","label":"Passed"},{"key":"failed","label":"Failed"},{"key":"blocked","label":"Blocked"},{"key":"notRun","label":"Not Run"},{"key":"inProgress","label":"In Progress"},{"key":"notApplicable","label":"Not Applicable"}],"outputs":[{"id":"pass_rate","label":"Pass rate","num":["passed"],"den":["passed","failed","blocked"],"scale":100,"unit":"%","capped":true,"denLabel":"Passed + Failed + Blocked","thresholdKey":"pass_rate"},{"id":"fail_rate","label":"Fail rate","num":["failed"],"den":["passed","failed","blocked"],"scale":100,"unit":"%","capped":true,"denLabel":"Passed + Failed + Blocked","thresholdKey":"fail_rate"},{"id":"block_rate","label":"Block rate","num":["blocked"],"den":["passed","failed","blocked"],"scale":100,"unit":"%","capped":true,"denLabel":"Passed + Failed + Blocked","thresholdKey":"block_rate"}]},{"id":"first_pass_yield","name":"First-Pass Yield","definition":"Share of executed scripts that passed on the first attempt.","numerator":"Scripts Passed on attempt 1","denominator":"Scripts executed (Passed + Failed + Blocked)","exclusions":"Scripts not yet executed and Not Applicable scripts.","source":"Execution records that include an attempt number","cycles":["fut_tut","sit","uat","regression"],"assumption":"A-14","inputs":[{"key":"firstAttemptPassed","label":"Scripts passed on attempt 1"},{"key":"executed","label":"Scripts executed (Passed + Failed + Blocked)"}],"outputs":[{"id":"first_pass_yield","label":"First-Pass Yield","num":["firstAttemptPassed"],"den":["executed"],"scale":100,"unit":"%","capped":true,"denLabel":"Scripts executed (Passed + Failed + Blocked)","thresholdKey":"first_pass_yield"}]},{"id":"retest_pass_rate","name":"Re-test Pass Rate","definition":"Share of re-executed scripts that passed.","numerator":"Re-executed scripts Passed","denominator":"Re-executed scripts with a result (attempt 2 or later: Passed + Failed + Blocked)","exclusions":"First-attempt executions; scripts not yet re-executed.","source":"Execution records that include an attempt number","cycles":["fut_tut","sit","uat","regression"],"assumption":"A-14","inputs":[{"key":"retestPassed","label":"Re-executed scripts passed"},{"key":"retestExecuted","label":"Re-executed scripts with a result"}],"outputs":[{"id":"retest_pass_rate","label":"Re-test Pass Rate","num":["retestPassed"],"den":["retestExecuted"],"scale":100,"unit":"%","capped":true,"denLabel":"Re-executed scripts with a result","thresholdKey":"retest_pass_rate"}]},{"id":"coverage_pct","name":"Coverage %","definition":"Share of in-scope user stories that have at least one linked test script in the cycle.","numerator":"Stories with at least one linked script in the cycle","denominator":"In-scope stories","exclusions":"Stories formally marked out of scope.","source":"Jira stories and script-to-story links","cycles":["fut_tut","sit","uat","regression"],"assumption":"A-20","inputs":[{"key":"storiesWithScript","label":"Stories with at least one linked script"},{"key":"storiesInScope","label":"In-scope stories"}],"outputs":[{"id":"coverage_pct","label":"Coverage %","num":["storiesWithScript"],"den":["storiesInScope"],"scale":100,"unit":"%","capped":true,"denLabel":"In-scope stories","thresholdKey":"coverage_pct"}]},{"id":"defect_density","name":"Defect Density","definition":"Defects found relative to the volume of executed testing, expressed per 100 executed scripts.","numerator":"Defects logged in the cycle","denominator":"Scripts executed (Passed + Failed + Blocked)","exclusions":"Defects rejected as invalid; scripts not yet executed.","source":"Defect records and execution records","cycles":["fut_tut","sit","uat","regression"],"inputs":[{"key":"defects","label":"Defects logged in the cycle"},{"key":"executed","label":"Scripts executed (Passed + Failed + Blocked)"}],"outputs":[{"id":"defect_density","label":"Defect Density","num":["defects"],"den":["executed"],"scale":100,"unit":"per100","capped":false,"denLabel":"Scripts executed (Passed + Failed + Blocked)","thresholdKey":"defect_density"}]},{"id":"defect_aging","name":"Defect Aging","definition":"Average number of days that open defects have been open. Bucket counts are shown on the Defect Management page.","numerator":"Sum of days open across all open defects","denominator":"Count of open defects","exclusions":"Resolved and Closed defects.","source":"Defect records with created date","cycles":["fut_tut","sit","uat","regression"],"assumption":"A-06","inputs":[{"key":"sumAgeDays","label":"Sum of days open across open defects"},{"key":"openDefects","label":"Count of open defects"}],"outputs":[{"id":"defect_aging","label":"Average defect age","num":["sumAgeDays"],"den":["openDefects"],"scale":1,"unit":"days","capped":false,"denLabel":"Count of open defects","thresholdKey":"defect_aging"}]},{"id":"defect_leakage","name":"Defect Leakage","definition":"Share of defects found in a cycle that should have been caught in an earlier cycle.","numerator":"Defects found in the cycle and attributed to an earlier cycle","denominator":"All defects found in the cycle","exclusions":"Not applicable to FUT/TUT because no earlier cycle exists.","source":"Defect records with an 'escaped from' attribution","cycles":["sit","uat","regression"],"assumption":"A-05","inputs":[{"key":"leaked","label":"Defects attributed to an earlier cycle"},{"key":"foundInCycle","label":"All defects found in the cycle"}],"outputs":[{"id":"defect_leakage","label":"Defect Leakage","num":["leaked"],"den":["foundInCycle"],"scale":100,"unit":"%","capped":true,"denLabel":"All defects found in the cycle","thresholdKey":"defect_leakage"}]},{"id":"data_completeness","name":"Data Completeness %","definition":"Share of expected source records that are converted, validated and supported by evidence.","numerator":"Validated records with evidence","denominator":"Expected source records","exclusions":"Records formally excluded with approval.","source":"Data conversion status and record counts","cycles":["sit","uat","regression"],"inputs":[{"key":"validatedRecords","label":"Validated records with evidence"},{"key":"expectedRecords","label":"Expected source records"}],"outputs":[{"id":"data_completeness","label":"Data Completeness %","num":["validatedRecords"],"den":["expectedRecords"],"scale":100,"unit":"%","capped":true,"denLabel":"Expected source records","thresholdKey":"data_completeness"}]}],"rag":{"intro":"Each metric is rated Green, Amber or Red by comparing its value with thresholds from the program configuration. The logic never contains a number of its own.","definitions":[{"id":"Green","text":"The value is on the target side of the Green threshold. No action is needed beyond normal monitoring."},{"id":"Amber","text":"The value has passed the Green threshold but has not reached the Red threshold. An owner and a recovery action are required."},{"id":"Red","text":"The value is beyond the Amber threshold. Escalate to the program manager and record a decision."},{"id":"Not configured","text":"No threshold is set for this metric, or the metric is Not Available. The portal never guesses a rating."}]},"roles_matrix":{"roleIds":["qa","tester","biz","tech","pm"],"activities":[["Define the test strategy and cycles","A","C","C","C","R"],["Prepare and review test scripts","A","R","C","C","I"],["Prepare test data and environments","C","I","I","A","I"],["Provision tester and business user access","I","I","I","A","C"],["Execute scripts and capture evidence","A","R","R","C","I"],["Log defects","A","R","R","C","I"],["Triage defects","A","C","C","R","I"],["Fix defects","I","I","I","A","I"],["Re-test fixed defects","A","R","R","C","I"],["Validate converted data","C","I","R","A","I"],["Approve entry and exit criteria","R","I","C","C","A"],["Accept results and sign off UAT","C","I","A","I","R"],["Report KPIs and RAG status","R","C","I","C","A"]]},"guides":{"tester":[{"title":"Before you test","steps":["Confirm that the cycle has started and that its entry criteria are met.","Check that you can sign in with the role assigned to the script.","Open the script and read the preconditions and test data.","Confirm the environment is the one named in the script.","Raise any gap before you start: missing access, missing data or an unclear step."]},{"title":"Run a script","steps":["Follow the steps in order. Do not skip or combine steps.","Compare the actual result with the expected result at each step.","Record the result for the script: Passed, Failed or Blocked.","If a step cannot be completed, stop and mark the script Blocked. Link the reason.","Mark a script Not Applicable only with approval from the QA lead."]},{"title":"Capture evidence","steps":["Take a screenshot at each point that proves an expected result.","Show the record number, the date and your user in the screenshot where possible.","Attach evidence to the execution record, not to an email.","Name files so that a reviewer can match them to the script and step."]},{"title":"Log a defect","steps":["Search existing defects first to avoid duplicates.","Use the defect template and complete every required field.","Set severity from business impact and propose a priority.","Link the defect to the script and the user story.","Link the defect ID back to the failed or blocked execution."]},{"title":"Re-test","steps":["Wait for the defect to reach Resolved.","Re-run the full script, not only the failed step.","Record the new attempt. The attempt number increases by one.","If it passes, move the defect to Closed. If it fails, move it to Reopened and add the new evidence."]},{"title":"Hand over results","steps":["Check that every executed script has a result, a date and evidence.","Check that every Failed or Blocked script has a defect or a documented disposition.","Give the QA lead your completed records before the daily status deadline."]}],"uat":[{"title":"Before you start","steps":["Make sure you have your sign-in and that you can open the test system.","Open the scripts assigned to you. Each script is one business task to try.","Ask your UAT lead if anything is unclear. Do not guess.","Have your sample data ready. Your UAT lead will tell you where to find it."]},{"title":"Run a script","steps":["Do each step in the script in order.","After each step, check: did the system do what the script said it would?","If yes, carry on. If no, stop and note exactly what happened.","At the end, mark the script Passed, Failed or Blocked."]},{"title":"Capture evidence","steps":["Take a screenshot when the screen shows the result you were asked to check.","Add a short comment about what you saw, especially if anything looked unusual.","Attach the screenshot to your script record."]},{"title":"Report a problem","steps":["Tell your UAT lead or log a defect using the template.","Say what you did, what you expected and what you saw.","Attach your screenshot.","Mark the script Failed, or Blocked if you could not finish it."]},{"title":"Re-test after a fix","steps":["You will be told when the problem is fixed.","Run the whole script again.","Record the new result and add new evidence."]},{"title":"Accept and sign off","steps":["Accept a script only when the result matches what your business needs.","Add a comment to explain any condition on your acceptance.","When all your scripts are done, complete the UAT sign-off form with your authorized approver.","Sign-off means the business accepts the solution for the scope tested. Outstanding items must be listed."]}],"checklist":[{"group":"Before UAT","items":["I can sign in to the UAT environment.","I know which scripts are assigned to me.","I have my test data and my role.","I know who my UAT lead is."]},{"group":"During UAT","items":["I followed each step in order.","I recorded Passed, Failed or Blocked for every script.","I attached a screenshot as evidence.","I added a comment where something looked unusual.","I reported every problem as a defect or to my UAT lead."]},{"group":"After fixes","items":["I re-ran the whole script after each fix.","I recorded the new result and new evidence."]},{"group":"Sign-off","items":["Every assigned script has a result and a comment.","Outstanding items are listed with an agreed owner.","The authorized approver has signed the UAT sign-off form."]}]},"sources":{"flows":[{"id":"jira","name":"Jira","role":"User stories and, where configured, defects.","text":"Export stories or defects to CSV an aliases":["test id","script id","test script id","found by test"],"example":"TS-012"},{"key":"created","label":"Created","type":"date","required":true,"description":"Date the defect was logged.","sources":["Jira","ALM","Excel"],"aliases":["created","created date","date created","opened","date logged"],"example":"2026-09-01"},{"key":"resolved","label":"Resolved","type":"date","required":false,"description":"Date the fix was delivered.","sources":["Jira","ALM","Excel"],"aliases":["resolved","resolved date","date resolved","fixed on"],"example":"2026-09-05"},{"key":"escapedFrom","label":"Escaped from cycle","type":"enum","required":false,"description":"Earlier cycle in which the defect should have been found. Used for Defect Leakage.","sources":["Jira","ALM","Excel"],"aliases":["escaped from","should have been found in","leaked from","origin cycle"],"example":"FUT/TUT","enum":"cycle"}],"stories":[{"key":"key","label":"Story key","type":"string","required":true,"description":"Unique identifier of the user story.","sources":["Jira","Excel"],"aliases":["story key","key","issue key","id"],"example":"STORY-001"},{"key":"summary","label":"Summary","type":"string","required":false,"description":"One-line description.","sources":["Jira","Excel"],"aliases":["summary","title","name"],"example":"Bill and invoice customers"},{"key":"module","label":"Module","type":"string","required":false,"description":"Oracle module or boundary application.","sources":["Jira","Excel"],"aliases":["module","application","component"],"example":"Accounts Receivable"},{"key":"process","label":"Process","type":"string","required":false,"description":"Business process.","sources":["Jira","Excel"],"aliases":["process","business process"],"example":"Bill and invoice customers"},{"key":"rice","label":"RICE ID","type":"string","required":false,"description":"Linked RICE object, if any.","sources":["Jira","Excel"],"aliases":["rice id","rice","rice object"],"example":"RICE-I01"}]},"quality":{"rules":[{"id":"DQ-01","check":"cycleMissing","applies":"Test results","rule":"Every test result has a cycle that maps to a configured cycle.","fix":"Add or correct the cycle in the source, or add the spelling to the cycle aliases in the configuration."},{"id":"DQ-02","check":"statusUnmapped","applies":"Test results and defects","rule":"Every status value maps to a known status.","fix":"Correct the status in the source, or add the spelling to the status aliases in the configuration."},{"id":"DQ-03","check":"duplicateTests","applies":"Test results","rule":"A test ID appears only once per cycle.","fix":"Remove the duplicate rows or keep only the latest result per script."},{"id":"DQ-04","check":"executedNoDate","applies":"Test results","rule":"Every Passed, Failed or Blocked result has an execution date.","fix":"Record the execution date in the source system."},{"id":"DQ-05","check":"failedNoDefect","applies":"Test results","rule":"Every Failed or Blocked result is linked to a defect, or has a documented disposition.","fix":"Log a defect and link it, or record the disposition."},{"id":"DQ-06","check":"defectNoStory","applies":"Defects","rule":"Every defect is linked to a user story.","fix":"Link the defect to its story in the source system."},{"id":"DQ-07","check":"storyNoScript","applies":"User stories","rule":"Every in-scope story has at least one test script.","fix":"Write or link a script, or mark the story out of scope with approval."},{"id":"DQ-08","check":"mappingMissing","applies":"Test results, defects and stories","rule":"Records carry a module and a process. RICE ID is expected only where a RICE object is involved.","fix":"Fill in the missing fields in the source system and re-load."},{"id":"DQ-09","check":"badDates","applies":"Test results and defects","rule":"Dates can be read and are not in the future.","fix":"Correct the date format in the source, for example 2026-09-14."},{"id":"DQ-10","check":"conversionNoEvidence","applies":"Data conversion","rule":"No conversion step is marked Complete without evidence.","fix":"Attach the evidence reference or change the step status."}]},"templates":[{"id":"t_script","name":"Test script","purpose":"Define the steps and expected results for one scenario.","body":"TEST SCRIPT\nScript ID: [Enter script ID]\nTitle: [Enter a short title]\nCycle: [FUT/TUT | SIT | UAT]\nModule and process: [Enter module] / [Enter process]\nRICE reference: [Enter RICE ID or \"None\"]\nLinked user story: [Enter story key]\nAuthor / reviewer: [Enter names]\n\nPreconditions: [Enter setup needed before the first step]\nTest data: [Enter data records or where to find them]\nRole / user to test with: [Enter role]\n\nSteps\n1. Action: [Enter action]    Expected result: [Enter expected result]\n2. Action: [Enter action]    Expected result: [Enter expected result]\n3. Action: [Enter action]    Expected result: [Enter expected result]\n\nPostconditions: [Enter state after the test]\nNotes: [Enter notes]"},{"id":"t_exec","name":"Test execution record","purpose":"Record one run of one script.","body":"TEST EXECUTION RECORD\nScript ID: [Enter script ID]\nCycle: [FUT/TUT | SIT | UAT]\nAttempt number: [1 for first attempt]\nTester: [Enter name]\nDate executed: [Enter date]\nEnvironment: [Enter environment]\nResult: [Passed | Failed | Blocked | Not Run | In Progress | Not Applicable]\nDefect ID (if Failed or Blocked): [Enter defect ID or documented disposition]\nEvidence reference: [Enter file name or link]\nComments: [Enter comments]"},{"id":"t_defect","name":"Defect report","purpose":"Log a defect with everything a fixer needs.","body":"DEFECT REPORT\nSummary: [Name the object and the problem]\nCycle found: [FUT/TUT | SIT | UAT]\nModule / process / RICE ID: [Enter] / [Enter] / [Enter or \"None\"]\nLinked story: [Enter story key]\nLinked test script: [Enter script ID]\nEnvironment and test data: [Enter environment and data used]\n\nSteps to reproduce\n1. [Enter step]\n2. [Enter step]\n3. [Enter step]\n\nExpected result: [Enter]\nActual result: [Enter]\nSeverity: [Critical | High | Medium | Low]\nPriority: [P1 | P2 | P3 | P4]\nEvidence attached: [Enter file name or link]\nReported by / date: [Enter name] / [Enter date]\nEscaped from an earlier cycle? [No | Yes - enter cycle]"},{"id":"t_uat","name":"UAT sign-off","purpose":"Record the business acceptance of the tested scope.","body":"UAT SIGN-OFF\nProgram: [Enter program name]\nScope tested: [Enter modules and processes]\nUAT period: [Enter start date] to [Enter end date]\nScripts planned / executed / accepted: [Enter] / [Enter] / [Enter]\nOpen defects by severity: [Enter counts]\nOutstanding items and agreed owners:\n1. [Enter item] - [Enter owner] - [Enter due date]\n\nAcceptance statement: On behalf of [Enter business area], I accept the tested scope subject to the outstanding items above.\nApprover name and role: [Enter]\nSignature / approval reference: [Enter]\nDate: [Enter date]"},{"id":"t_checklist","name":"Entry / exit checklist","purpose":"Confirm that a cycle can start or close.","body":"ENTRY / EXIT CHECKLIST\nCycle: [FUT/TUT | SIT | UAT]\nCheckpoint: [Entry | Exit]\nDate reviewed: [Enter date]\n\nCriterion | Owner | Evidence reference | Threshold (from configuration) | Met? (Yes / No / Waived)\n[Enter criterion] | [Enter owner] | [Enter evidence] | [Enter threshold] | [Enter]\n[Enter criterion] | [Enter owner] | [Enter evidence] | [Enter threshold] | [Enter]\n\nWaivers and approvers: [Enter waiver detail and approver]\nDecision: [Proceed | Proceed with conditions | Do not proceed]"},{"id":"t_ready","name":"Readiness dependency log","purpose":"Track dependencies such as access, data and environments.","body":"READINESS DEPENDENCY LOG\nID: [Enter]\nDependency: [Enter, for example user access, data load, environment refresh]\nNeeded by cycle: [FUT/TUT | SIT | UAT]\nNeeded by date: [Enter date]\nOwner: [Enter name]\nStatus: [Not started | In progress | Complete]\nEvidence of completion: [Enter reference]\nImpact if late: [Enter]\nEscalation contact: [Enter]\nNote: this log tracks readiness. It does not record test results."}],"glossary":[{"term":"ALM","def":"Application lifecycle management tool used to hold test scripts, executions and results. Direct feeds from ALM require an adapter."},{"term":"Accounts Receivable","def":"Oracle Fusion module for customer invoices, receipts and balances."},{"term":"Acceptance","def":"A business user's confirmation that a script result meets business needs."},{"term":"Aging","def":"Number of days a defect has been open."},{"term":"Blocked","def":"A script that could not be completed because of a defect, data or environment dependency."},{"term":"Boundary application","def":"A system outside the Oracle Fusion modules that exchanges data with them."},{"term":"BOM","def":"Bill of materials: the list of components that make up an item."},{"term":"Cloud Tax for European VAT","def":"Tax capability covering European VAT. The country in scope is set in the configuration."},{"term":"Conversion","def":"Moving data from a legacy system into Oracle Fusion Cloud ERP."},{"term":"Cutover","def":"The planned move of business operations from the old system to the new one. Mock cutovers rehearse it."},{"term":"Data access set","def":"A security setting that controls which data a user can see and change."},{"term":"Defect leakage","def":"Share of defects found in a cycle that should have been found in an earlier cycle."},{"term":"Entry criteria","def":"Conditions that must be met before a test cycle starts."},{"term":"Exit criteria","def":"Conditions that must be met before a test cycle closes."},{"term":"Extension","def":"A RICE object that adds custom behavior around Oracle Fusion. Extensions are not modifications to Oracle-provided base code."},{"term":"First-Pass Yield","def":"Share of executed scripts that passed on the first attempt."},{"term":"Fusion Tax","def":"Oracle Fusion capability for determining and calculating transaction tax."},{"term":"FUT","def":"Functional unit testing: testing individual functions with mock data."},{"term":"Interface","def":"A RICE object that moves data between Oracle Fusion and another system."},{"term":"Jira","def":"Work tracking tool used for user stories and, where configured, defects."},{"term":"Mock data","def":"Made-up or masked data used in early testing."},{"term":"Pod refresh","def":"Refreshing an Oracle cloud test environment from another environment. Access should be re-checked afterwards."},{"term":"RAG","def":"Red, Amber, Green status rating."},{"term":"Regression testing","def":"Re-testing existing functions to confirm that a change did not break them."},{"term":"Report (RICE)","def":"A RICE object that presents Oracle Fusion data in a defined layout."},{"term":"RICE","def":"Reports, Interfaces, Conversions and Extensions: the types of custom objects built around the standard solution."},{"term":"SIT","def":"System integration testing: end-to-end testing across modules and boundary applications."},{"term":"SoD","def":"Segregation of duties: preventing one person from holding conflicting responsibilities."},{"term":"Sign-off","def":"A formal record that an authorized approver accepts a result or a scope."},{"term":"Subscription Management","def":"Oracle Fusion module for subscription products and their lifecycle."},{"term":"TUT","def":"Technical unit testing: testing individual technical components such as interfaces and extensions."},{"term":"UAT","def":"User acceptance testing: business users confirm the solution meets their needs."},{"term":"Vertex","def":"Third-party tax engine integrated for US B2B sales and use tax."}],"faq":[{"q":"Why are FUT/TUT, SIT and UAT never combined into one pass rate?","a":"They use different data, different testers and different goals. A combined rate would hide the real status of each cycle. Combine them only when the definitions are comparable and the combined figure is labeled."},{"q":"Does Not Run count as a failure or as a pass?","a":"Neither. Not Run is excluded from the pass, fail and block rates. It lowers Execution %."},{"q":"What if a metric cannot be calculated?","a":"The portal shows Not Available with the reason, for example a zero denominator or missing source data. It never shows zero for missing data."},{"q":"Can I load data from Jira or ALM?","a":"Yes, from exports. Open Data sources and integration, choose the Import data tab and map your columns. A direct live connection is not included. ALM-specific details are marked ALM adapter required."},{"q":"Where do thresholds come from?","a":"From portal-config.json. Entry and exit thresholds and RAG thresholds are read from it. Any threshold that is not set shows To be confirmed by project team."},{"q":"What is the difference between severity and priority?","a":"Severity is the business impact of the defect. Priority is how soon it should be fixed."},{"q":"Is security access a test result?","a":"No. It is a readiness dependency unless an explicit test record exists."},{"q":"How do I add a module or a cycle?","a":"Edit portal-config.json. See the instructions in the README. No page code needs to change."},{"q":"What does 'complete' mean for a data conversion step?","a":"A step is complete only when source evidence is recorded. A step marked Complete without evidence is shown as not counted."},{"q":"Is anything stored in my browser?","a":"No. The portal does not use localStorage or sessionStorage. Imported data lives in memory until you reload the page."}],"assumptions":[{"id":"A-01","text":"The portal is a reference site. It reads exported files only and makes no live connection to Jira, ALM or any other system."},{"id":"A-02","text":"All sample content for the program called Lime is fictional and generic: processes, RICE object names, module links, criteria owners, RACI letters, glossary text and sample records."},{"id":"A-03","text":"Sample RAG thresholds exist for three metrics only (Execution %, Pass rate, average defect age) and are illustrative. Aging bucket boundaries are illustrative. All other thresholds, limits and SLAs are not set."},{"id":"A-04","text":"Execution % uses Passed + Failed + Blocked as the numerator and all planned, applicable scripts (Not Applicable excluded) as the denominator."},{"id":"A-05","text":"Defect Leakage is calculated for the receiving cycle: defects found in the cycle and attributed to an earlier cycle, divided by all defects found in the cycle."},{"id":"A-06","text":"Open defects are those with status Open, In Progress or Reopened. Resolved and Closed are not counted as open."},{"id":"A-07","text":"Status, severity, priority and cycle aliases (for example To Do mapped to Open) are generic and editable. Values that match no alias are flagged as unmapped, never guessed."},{"id":"A-08","text":"Sheet names and purposes for Testing_Daily_Status.xlsx are placeholders and must be confirmed against the real workbook."},{"id":"A-09","text":"The defect lifecycle transitions shown are generic and must be confirmed against the workflow in the defect source system."},{"id":"A-10","text":"Only the RICE complexity distribution (3 Simple, 6 Medium, 4 Complex, 7 Very Complex) comes from the scope. Object names, types and module links are illustrative."},{"id":"A-11","text":"'Clientes' in the conversion object list is treated as Customers and covered by Customer Master."},{"id":"A-12","text":"Vertex integration is treated as an integration / boundary application. How it is tested in each cycle is to be confirmed."},{"id":"A-13","text":"Severity and priority definitions and the severity/priority matrix are generic industry conventions, not Oracle- or client-specific rules."},{"id":"A-14","text":"First-Pass Yield and Re-test Pass Rate need an attempt number per result. Without it, they show Not Available."},{"id":"A-15","text":"ALM-specific connection details are not provided. Exports from ALM can be loaded as CSV or Excel files. A direct feed needs an ALM adapter."},{"id":"A-16","text":"Each test and defect row is assigned to a cycle through the cycle aliases. Rows that match no alias are reported as unmapped and are not merged into any cycle."},{"id":"A-17","text":"The portal is one HTML file that loads Chart.js and SheetJS from a public CDN. Open it with internet access. Open Sans loads from Google Fonts and falls back to Arial."},{"id":"A-18","text":"Imported data is held in memory only. Reloading the page returns to the configuration and sample data."},{"id":"A-19","text":"Imported dates are read in ISO format and common day-month-year formats. Unreadable dates are flagged and are not guessed."},{"id":"A-20","text":"Coverage % counts all loaded stories as in scope because no out-of-scope flag exists in the sample dictionary."},{"id":"A-21","text":"Entry and exit criteria owners and evidence names are illustrative. Thresholds are not set."},{"id":"A-22","text":"The escalation path levels and the roles in the RACI table are illustrative. Triggers are not set."},{"id":"A-23","text":"Fixed record counts for Customer Master and Product Master, conversion evidence references, and conversion step statuses are sample values."}],"openItems":[{"id":"O-01","item":"Confirm the client and program name, and the go-live date.","owner":"Program manager"},{"id":"O-02","item":"Confirm the final module list, exclusions and process-to-module mapping.","owner":"QA lead / Solution architect"},{"id":"O-03","item":"Confirm the European tax country for Cloud Tax.","owner":"Program manager"},{"id":"O-04","item":"Confirm how Vertex integration is tested in SIT and UAT.","owner":"Technical owner"},{"id":"O-05","item":"Provide entry and exit thresholds, including the SIT data completeness threshold.","owner":"QA lead"},{"id":"O-06","item":"Provide RAG thresholds for every KPI.","owner":"Program manager"},{"id":"O-07","item":"Provide defect response and resolution SLAs by severity.","owner":"QA lead"},{"id":"O-08","item":"Confirm the defect source of truth: Jira, ALM or both.","owner":"QA lead"},{"id":"O-09","item":"Confirm ALM version, export method and whether an adapter is planned.","owner":"Technical owner"},{"id":"O-10","item":"Provide Jira project keys, workflow status names and custom field names.","owner":"QA lead"},{"id":"O-11","item":"Provide the real layout of Testing_Daily_Status.xlsx.","owner":"QA lead"},{"id":"O-12","item":"Provide the testing dashboard URL.","owner":"Program manager"},{"id":"O-13","item":"Confirm the RICE object list, owners and complexity ratings.","owner":"Technical owner"},{"id":"O-14","item":"Confirm the conversion object list, expected record counts and the evidence repository.","owner":"Data lead"},{"id":"O-15","item":"Confirm security design status, SoD approach and the pod refresh schedule.","owner":"Technical owner"},{"id":"O-16","item":"Confirm the SIT business stakeholders and the UAT approvers.","owner":"Program manager / Business lead"},{"id":"O-17","item":"Decide whether a regression cycle is needed and, if so, define it.","owner":"Program manager"},{"id":"O-18","item":"Confirm the escalation path, triggers and the RACI.","owner":"Program manager"}],"selfCheck":["Navigation: open every page from the left menu. The page title changes and focus moves to the main heading.","Role path: choose each role in Start here. A numbered path appears and the links open the right pages.","Search: type 'denominator'. Results appear. Use the arrow keys and Enter to open one. Press Escape to close the list.","Filters: on Scope, RICE and Defects, change each filter. The row counts update and Clear filters restores them.","Calculator: on Metrics, calculate Pass rate with Passed 25, Failed 3, Blocked 2, Not Run 10. Expect 83.3% with denominator 30.","Missing data: clear one input in the calculator. Expect Not Available with a reason, not 0.","Zero denominator: enter 0 for Passed, Failed and Blocked. Expect Not Available.","Import: load a file from the sample-imports folder. The data banner changes and the pages update.","Modal: open a KPI or template. Press Escape. The dialog closes and focus returns to the button.","Copy and print: copy a template and paste it elsewhere. Print a template and the UAT checklist.","Keyboard only: tab through a page. Focus is always visible and nothing is skipped or trapped.","Contrast and zoom: zoom to 200% and check the layout. Check that status chips show text as well as color.","Storage: confirm in browser tools that localStorage and sessionStorage are empty."],"sampleData":{"note":"Fictional demo records. Dates are stored as days before the page is opened.","tests":[{"id":"TS-001","name":"Sample script TS-001: maintain product and pricing setup","cycle":"fut_tut","module":"pm","process":"P01","rice":null,"storyKey":"STORY-001","status":"Passed","attempt":1,"executedDaysAgo":null,"defectId":null},{"id":"TS-002","name":"Sample script TS-002: capture and import orders","cycle":"fut_tut","module":"om","process":"P02","rice":null,"storyKey":"STORY-002","status":"Passed","attempt":2,"executedDaysAgo":null,"defectId":null},{"id":"TS-003","name":"Sample script TS-003: manage the subscription lifecycle","cycle":"fut_tut","module":"sub","process":"P03","rice":"RICE-R03","storyKey":"STORY-003","status":"Passed","attempt":1,"executedDaysAgo":42,"defectId":null},{"id":"TS-004","name":"Sample script TS-004: calculate us sales and use tax","cycle":"fut_tut","module":"vertex","process":"P04","rice":null,"storyKey":"STORY-004","status":"Passed","attempt":1,"executedDaysAgo":57,"defectId":null},{"id":"TS-005","name":"Sample script TS-005: calculate european vat","cycle":"fut_tut","module":"eutax","process":"P05","rice":null,"storyKey":"STORY-005","status":"Not Applicable","attempt":null,"executedDaysAgo":null,"defectId":null},{"id":"TS-006","name":"Sample script TS-006: bill and invoice customers","cycle":"fut_tut","module":"ar","process":null,"rice":"RICE-R01","storyKey":"STORY-006","status":"Passed","attempt":2,"executedDaysAgo":24,"defectId":null},{"id":"TS-00 /* ---------------------------------------------------------------- import normalisation */

/* ---------------------------------------------------------------- data quality checks and traceability gaps */
const NA_RES = reason => ({ available: false, reason, ids: [], total: 0 });

const CHECKS = {

    if (!S.tests.length) return NA_RES('No test results are loaded.');

  },
  statusUnmapped() {
    if (!S.tests.length && !S.defects.length) return NA_RES('No test results or defects are loaded.');
    const ids = S.tests.filter(t => !t.status).map(t => t.id).concat(S.defects.filter(d => !d.status).map(d => d.id));
    return RES_OK(ids, S.tests.length + S.defects.length);
  },
  duplicateTests() {
    if (!S.tests.length) return NA_RES('No test results are loaded.');
    const seen = {}, dup = [];
    S.tests.forEach(t => { const k = (t.cycle || '') + '|' + t.id; seen[k] = (seen[k] || 0) + 1; if (seen[k] === 2) dup.push(t.id); });
    return RES_OK(dup, S.tests.length);
  },
  executedNoDate() {
    if (!S.tests.length) return NA_RES('No test results are loaded.');
    const ex = S.tests.filter(t => PFB.includes(t.status));
    return RES_OK(ex.filter(t => !t.executedOn).map(t => t.id), ex.length);
  },
  failedNoDefect(opt) {
    if (!S.tests.length) return NA_RES('No test results are loaded.');

    const arr = S.tests.filter(t => incl.includes(t.status));
    const linked = new Set(S.defects.map(d => d.testId).filter(Boolean));
    const hasDefectData = S.defects.length > 0;
    return RES_OK(arr.filter(t => !t.defectId && !(hasDefectData && linked.has(t.id))).map(t => t.id), arr.length);
  },
  defectNoStory() {
    if (!S.defects.length) return NA_RES('No defects are loaded.');
    const keys = new Set(S.stories.map(s => s.key));
    return RES_OK(S.defects.filter(d => !d.storyKey || (S.stories.length && !keys.has(d.storyKey))).map(d => d.id), S.defects.length);
  },
  storyNoScript() {

  const rows = labels.map((l, i) => tr([esc(l)].concat(datasets.map(d => fmtInt(d.data[i]))), { rowHead: true }));
  return `<details class="acc small"><summary>Show chart data as a table</summary><div class="accbody">${tbl(head, rows, { label: 'Chart data' })}</div></details>`;
}
function dl(pairs) { return `<dl class="facts">${pairs.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`; }
function printContent(title, html) {
  let area = document.getElementById('print-area'); if (!area) { area = document.createElement('div'); area.id = 'print-area'; document.body.appendChild(area); }
  area.innerHTML = `<h1>${esc(title)}</h1>${html}`;
  document.body.classList.add('print-one');
  const done = () => { document.body.classList.remove('print-one'); area.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  if (typeof window.print === 'function') { try { window.print(); } catch (e) { done(); } }
}

/* ------------------------------------------------------------------ RICE */
const CX_COLORS = { 'Simple': '#86BC25', 'Medium': '#0076A8', 'Complex': '#75787B', 'Very Complex': '#2B2B2B' };
function riceCounts() {
  const R = CFG.rice, byCx = {}, byType = {};
  R.complexities.forEach(c => byCx[c] = 0); R.types.forEach(t => { byType[t] = {}; R.complexities.forEach(c => byType[t][c] = 0); });
  R.objects.forEach(o => { if (byCx[o.complexity] != null) byCx[o.complexity]++; if (byType[o.type]) byType[o.type][o.complexity]++; });
  return { byCx, byType };
}
function riceTable() {
  const t = ($('#ri-type') || {}).value || '', c = ($('#ri-cx') || {}).value || '', m = ($('#ri-mod') || {}).value || '', q = (($('#ri-q') || {}).value || '').toLowerCase();
  const list = CFG.rice.objects.filter(o => (!t || o.type === t) && (!c || o.complexity === c) && (!m || o.module === m) && (!q || (o.id + ' ' + o.name + ' ' + modName(o.module)).toLowerCase().includes(q)));
  const rows = list.map(o => tr([esc(o.id), esc(o.name), esc(o.type), chip(o.complexity, o.complexity === 'Very Complex' ? 'dark' : 'neutral'), esc(modName(o.module))]));
  return { html: list.length ? tbl(['ID', 'Object', 'Type', 'Complexity', 'Module'], rows, { label: 'RICE objects' }) : '<p>No RICE objects match the filters.</p>', count: `Showing ${list.length} of ${CFG.rice.objects.length} objects` };
}

    <div><button type="button" class="btn secondary" id="ri-clear">Clear filters</button></div></div><p id="ri-count" class="small" aria-live="polite"></p><div id="ri-out"></div>`;

/* ------------------------------------------------------------------ DATA CONVERSION */
function stepEff(st) {
  const V = CFG.conversion.statusValues, has = !!(st.evidence && String(st.evidence).trim());
  if (isStepComplete(st.status)) return has ? { k: 'ok', label: 'Complete', counted: true } : { k: 'warn', label: 'Complete, no evidence', counted: false };
  if (st.status === V[1]) return { k: 'info', label: st.status, counted: false };
  return { k: 'neutral', label: st.status || V[0], counted: false };
}
PAGES.data = function () {
  const C = CFG.conversion;
  const steps = `<ol class="steps">${C.steps.map(s => `<li><strong>${esc(s.name)}</strong><span>${esc(s.text)}</span></li>`).join('')}</ol>` + callout('key', `<p>${esc(C.evidenceRule)} A step marked Complete without evidence is shown as not counted.</p>`, 'Evidence rule');
  let counted = 0, totalSteps = 0;
  const rows = C.objects.map(o => {
    let n = 0;
    const cells = C.steps.map(s => { const st = o.steps[s.id] || { status: C.statusValues[0] }; const e = stepEff(st); totalSteps++; if (e.counted) { n++; counted++; }
      return `${chip(e.label, e.k)}${st.evidence ? `<br><span class="small muted">${esc(st.evidence)}</span>` : ''}`; });
    const comp = (o.expectedRecords != null && o.validatedRecords != null && o.expectedRecords > 0) ? `<strong>${(o.validatedRecords / o.expectedRecords * 100).toFixed(1)}%</strong><br><span class="small muted">${fmtInt(o.validatedRecords)} / ${fmtInt(o.expectedRecords)} records</span>`
      : `<span class="na">Not Available</span><span class="reason">${o.expectedRecords == null ? 'Expected record count not provided.' : 'Validated record count not provided.'}</span>`;
    return tr([`<strong>${esc(o.name)}</strong>`].concat(cells, [`${n} of ${C.steps.length}`, comp]), { rowHead: true });
  });
  const ct = conversionTotals();
  const summary = `<div class="grid3"><article class="panel stat"><div class="big">${counted} of ${totalSteps}</div><div>Steps counted complete, with evidence</div></article>
    <article class="panel stat"><div class="big">${ct ? (ct.validatedRecords / ct.expectedRecords * 100).toFixed(1) + '%' : 'Not Available'}</div><div>${ct ? `Data Completeness %. Denominator ${fmtInt(ct.expectedRecords)} expected records, from ${ct.n} of ${ct.of} objects that have both counts` : 'Data Completeness %. No object has both record counts'}</div></article></div>`;
  const table = tbl(['Data object'].concat(C.steps.map(s => esc(s.name)), ['Steps counted', 'Data Completeness %']), rows, { label: 'Data conversion status', cls: 'wide' });
  return `<p class="lead">Objects are examples and can be added in the configuration. Step statuses, record counts and evidence references are sample values. ${ab('A-23')} ${ab('A-11')}</p>` +
    sec('data', 'Status steps', steps) + sec('data', 'Conversion readiness by object', summary + table);
};

/* ------------------------------------------------------------------ DEFECTS */
function srcNote() {
  const s = S.defectSource;
  return s === 'Jira' ? 'Defects are read from Jira exports.' : s === 'ALM' ? `Defects are read from ALM. ${chip('ALM adapter required', 'warn')} for a direct feed. ALM exports can be loaded as files.` :
    `Defects may be read from Jira, ALM or both. ${chip('ALM adapter required', 'warn')} for any direct ALM feed. Exports can be loaded as files.`;
}

function defTable() {
  const g = id => ($(id) || {}).value || '';
  const cy = g('#df-cycle'), sv = g('#df-sev'), st = g('#df-status'), md = g('#df-mod'), q = g('#df-q').toLowerCase();
  const list = S.defects.filter(d => (!cy || d.cycle === cy) && (!sv || d.severity === sv) && (!st || d.status === st) && (!md || d.module === md) && (!q || (d.id + ' ' + (d.summary || '') + ' ' + (d.storyKey || '')).toLowerCase().includes(q)));
  const rows = list.slice(0, 100).map(d => {
    const a = isOpen(d) ? ageDays(d) : null;
    return tr([esc(d.id), esc(d.summary || ''), esc(d.cycle ? cycleById(d.cycle).short : 'Unmapped'), esc(d.severity || 'Unmapped'), esc(d.priority || ''), esc(d.status || 'Unmapped'),
      esc(d.module ? modName(d.module) : (d.moduleRaw || '')), isOpen(d) ? (a == null ? '<span class="na">Not Available</span>' : a + ' days') : '<span class="muted">Not open</span>', esc(d.storyKey || '')]);
  });

function agingTable() {
  const open = S.defects.filter(isOpen);
  if (!S.defects.length) return `<p><span class="na">Not Available</span><span class="reason">No defects are loaded.</span></p>`;
  const rows = CFG.defects.aging.map(b => { const n = open.filter(d => { const a = ageDays(d); return a != null && a >= b.min && (b.max == null || a <= b.max); }).length; return tr([esc(b.label), fmtInt(n)]); });
  const nodate = open.filter(d => ageDays(d) == null).length;
  if (nodate) rows.push(tr(['Date missing', `${nodate} <span class="small muted">(not counted in any bucket)</span>`]));
  return tbl(['Age of open defects', 'Open defects'], rows, { label: 'Aging buckets' }) + `<p class="small">Open means status ${CFG.defects.openStatuses.map(esc).join(', ')}. ${ab('A-06')}</p>`;
}

/* ------------------------------------------------------------------ TRACEABILITY */
function traceSvg(gaps) {
  const nodes = CFG.traceability.nodes, n = nodes.length, W = 1000, H = 330, bw = 140, bh = 84, y = 84, gap = (W - n * bw) / (n + 1);
  const X = i => gap + i * (bw + gap), cnt = id => { const g = gaps.find(x => x.id === id); return g && g.res.available ? String(g.res.ids.length) : 'NA'; };
  let s = `<svg viewBox="0 0 ${W} ${H}" class="trace" role="group" aria-label="Traceability chain from user story to defect"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>`;
  for (let i = 0; i < n - 1; i++) s += `<line x1="${X(i) + bw}" y1="${y + bh / 2}" x2="${X(i + 1) - 2}" y2="${y + bh / 2}" class="edge" marker-end="url(#arr)"/>`;
  const xs = X(0) + bw / 2, xe = X(n - 1) + bw / 2, yb = y + bh + 150;
  s += `<path d="M ${xe} ${y + bh + 2} C ${xe} ${yb}, ${xs} ${yb}, ${xs} ${y + bh + 6}" class="edge dashed" marker-end="url(#arr)"/>`;
  nodes.forEach((nd, i) => {
    const sys = nd.system.replace('{{defectSource}}', defSrcLabel());
    s += `<g class="node" data-node="${nd.id}" role="button" tabindex="0" aria-pressed="false" aria-label="${esc(nd.label)} (${esc(sys)}). Show details"><rect x="${X(i)}" y="${y}" width="${bw}" height="${bh}" rx="8"/><text x="${X(i) + bw / 2}" y="${y + 38}" text-anchor="middle" class="nlabel">${esc(nd.label)}</text><text x="${X(i) + bw / 2}" y="${y + 60}" text-anchor="middle" class="nsys">${esc(sys)}</text></g>`;
  });
  const mk = (id, cx, cy, label, ly) => { const g = gaps.find(x => x.id === id); if (!g) return ''; return `<g class="marker" data-gap="${id}" role="button" tabindex="0" aria-label="${esc(g.title)}: ${cnt(id)}. Show records"><circle cx="${cx}" cy="${cy}" r="18"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" class="mcount">${cnt(id)}</text><text x="${cx}" y="${ly}" text-anchor="middle" class="mlabel">${esc(label)}</text></g>`; };
  s += mk('g1', (X(0) + bw + X(1)) / 2, 40, 'Stories without scripts', 74);
  s += mk('g2', (X(n - 2) + bw + X(n - 1)) / 2, 40, 'Failed tests without defects', 74);
  s += mk('g4', X(1) + bw / 2, y + bh + 40, 'Missing mapping', y + bh + 76);
  s += mk('g3', (xs + xe) / 2, y + bh + 116, 'Defects without stories', y + bh + 152);
  return s + '</svg>';
}
function showGap(id) {
  const g = traceGaps().find(x => x.id === id); if (!g) return;
  const body = `<p>${esc(g.text)}</p><p><strong>How to fix:</strong> ${esc(g.fix)}</p>` + (g.res.available
    ? `<p><strong>Records found:</strong> ${g.res.ids.length} of ${fmtInt(g.res.total)} checked.</p>${g.res.detail ? `<p class="small">${esc(g.res.detail)}</p>` : ''}${g.res.ids.length ? `<ul class="idlist">${g.res.ids.slice(0, 100).map(i => `<li>${esc(i)}</li>`).join('')}</ul>${g.res.ids.length > 100 ? `<p class="small">Showing the first 100.</p>` : ''}` : '<p>No records need attention.</p>'}`
    : `<p><span class="na">Not Available</span><span class="reason">${esc(g.res.reason)}</span></p>`);
  openModal(g.title, body);
}
PAGES.trace = function () {
  const T = CFG.traceability, gaps = traceGaps();
  const diagram = `<p>Select a step to see what it holds. Select a number to see the records with that gap. The dashed line shows that every defect must lead back to a story.</p><div class="tracewrap">${traceSvg(gaps)}</div><div id="tr-detail" class="panel" aria-live="polite"></div>`;
  const rows = gaps.map(g => tr([`<strong>${esc(g.title)}</strong>`, esc(g.text), esc(g.fix), g.res.available ? `<strong>${g.res.ids.length}</strong> of ${fmtInt(g.res.total)}` : `<span class="na">Not Available</span><span class="reason">${esc(g.res.reason)}</span>`,
    g.res.available && g.res.ids.length ? `<button type="button" class="linkbtn" data-show-gap="${g.id}">Show records</button>` : ''], { rowHead: true }));
  return sec('trace', 'Trace the chain', diagram) + sec('trace', 'Common gaps', tbl(['Gap', 'What it means', 'How to fix', 'Found now', ''], rows, { label: 'Traceability gaps' }) + `<p class="small">Counts come from the loaded data (${S.sources.tests.type === 'import' || S.sources.defects.type === 'import' ? 'imported' : 'sample'}). ${ab('A-15')}</p>`);
};
MOUNT.trace = function (root) {

  };
  $$('.node', root).forEach(g => { g.addEventListener('click', () => show(g.dataset.node)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g.dataset.node); } }); });
  $$('.marker', root).forEach(g => { g.addEventListener('click', () => showGap(g.dataset.gap)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showGap(g.dataset.gap); } }); });
  show(T.nodes[0].id);

  }).join('');
