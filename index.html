   ===================================================================== */
let INDEX = [], modalOpener = null, toastTimer = null, searchActive = -1, searchHits = [];

function pageIdFromHash() { const m = location.hash.match(/^#\/([a-z]+)/); return (m && CFG.pages[m[1]]) ? m[1] : 'home'; }

/* ---------------------------------------------------------------- navigation */
function buildShell() {
  $('#brand-name').textContent = CFG.program.name; $('#brand-sub').textContent = CFG.program.title;
  $('#nav').innerHTML = CFG.navGroups.map(g => `<div class="navgroup"><h2 class="navlabel">${esc(g.label)}</h2><ul>${g.pages.map(p => `<li><a href="#/${p}" data-page="${p}">${esc(CFG.pages[p].nav)}</a></li>`).join('')}</ul></div>`).join('');
  $('#role').innerHTML = `<option value="">Choose your role</option>` + CFG.roles.map(r => `<option value="${esc(r.id)}" ${r.id === S.role ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
  renderRolePath();
}
function renderRolePath() {
  const r = CFG.roles.find(x => x.id === S.role), el = $('#rolepath');
  el.innerHTML = r ? `<p class="small">${esc(r.description)}</p><ol>${r.path.map(p => `<li><a href="#/${p}" data-page="${p}">${esc(CFG.pages[p].nav)}</a></li>`).join('')}</ol>` : '';
  markCurrent();
}
function markCurrent() { const id = S.page; $$('[data-page]').forEach(a => a.dataset.page === id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')); }
function closeNav() { document.body.classList.remove('nav-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }

/* ---------------------------------------------------------------- tabs, reveal, scroll */
function activateTab(tab) {
  const wrap = tab.closest('.tabs');
  $$('[role="tab"]', wrap).forEach(t => { const on = t === tab; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; const p = document.getElementById(t.getAttribute('aria-controls')); if (p) p.hidden = !on; });
  S.charts.forEach(c => { try { c.resize(); } catch (e) { } });
}
function initTabs(root) {
  $$('.tabs', root).forEach(wrap => {
    const tabsEls = $$('[role="tab"]', wrap);
    tabsEls.forEach((t, i) => {
      t.addEventListener('click', () => activateTab(t));
      t.addEventListener('keydown', e => {
        let n = null;
        if (e.key === 'ArrowRight') n = tabsEls[(i + 1) % tabsEls.length]; else if (e.key === 'ArrowLeft') n = tabsEls[(i - 1 + tabsEls.length) % tabsEls.length];
        else if (e.key === 'Home') n = tabsEls[0]; else if (e.key === 'End') n = tabsEls[tabsEls.length - 1];
        if (n) { e.preventDefault(); activateTab(n); n.focus(); }
      });
    });
  });
}
function revealTarget(el) {
  let p = el;
  while (p && p !== document.body) {
    if (p.getAttribute && p.getAttribute('role') === 'tabpanel' && p.hidden) { const t = document.getElementById(p.getAttribute('aria-labelledby')); if (t) activateTab(t); }
    if (p.tagName === 'DETAILS') p.open = true;
    p = p.parentElement;
  }
}
function scrollToSection(id) {
  const el = document.getElementById(id); if (!el) return;
  revealTarget(el);
  $$('.target').forEach(x => x.classList.remove('target')); el.classList.add('target');
  el.scrollIntoView({ block: 'start' });
  const h = el.querySelector('h2,h3'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

/* ---------------------------------------------------------------- routing */
function route(opts) {
  opts = opts || {};
  destroyCharts();
  const id = pageIdFromHash(); S.page = id;
  const root = $('#content');
  root.innerHTML = PAGES[id]();
  $('#page-title').textContent = CFG.pages[id].title;
  document.title = `${CFG.pages[id].title} | ${CFG.program.name} ${CFG.program.title}`;
  initTabs(root);
  if (MOUNT[id]) MOUNT[id](root);
  markCurrent(); updateBanner();
  if (opts.tabs) Object.keys(opts.tabs).forEach(k => { const t = document.getElementById(opts.tabs[k]); if (t) activateTab(t); });
  if (S.pendingScroll) { const sc = S.pendingScroll; S.pendingScroll = null; scrollToSection(sc); }
  else if (opts.focus) { window.scrollTo(0, 0); $('#page-title').focus({ preventScroll: true }); }
}
function rerender() {
  const y = window.scrollY, tabs = {};
  $$('#content .tabs').forEach(w => { const sel = $('[role="tab"][aria-selected="true"]', w); if (sel) tabs[w.dataset.tabs] = sel.id; });
  route({ tabs }); window.scrollTo(0, y);
}
function navigate(pid, secId) {
  S.pendingScroll = secId || null;
  if (location.hash === '#/' + pid) { route({ focus: !secId }); closeNav(); }
  else { S.focusNext = !secId; location.hash = '#/' + pid; }
}
function refreshAll(full) { if (full) buildShell(); buildIndex(); rerender(); }

/* ---------------------------------------------------------------- data banner */
function updateBanner() {
  const el = $('#databanner'), ks = ['tests', 'defects', 'stories'], anyImp = ks.some(k => S.sources[k].type === 'import');
  const lab = { tests: 'Test results', defects: 'Defects', stories: 'Stories' };
  const parts = ks.map(k => { const s = S.sources[k]; return `${lab[k]}: ${s.type === 'import' ? `imported (${esc(s.file)}, ${fmtInt(s.count)})` : s.type === 'sample' ? 'sample' : 'none loaded'}`; }).join('. ');
  el.className = 'databanner ' + (anyImp ? 'imported' : 'sample');
  el.innerHTML = `<strong>${anyImp ? 'Imported data in use.' : `Illustrative sample data for ${esc(CFG.program.name)}.`}</strong> ${parts}. <a href="#/sources" data-go="sources" data-sec="sources-import-data-from-a-file">Import Jira, ALM or Excel data</a>`;
}

/* ---------------------------------------------------------------- search */
function buildIndex() {
  INDEX = [];
  Object.keys(CFG.pages).forEach(pid => {
    let html = ''; try { html = PAGES[pid](); } catch (e) { return; }
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    INDEX.push({ page: pid, id: '', title: CFG.pages[pid].title, text: (CFG.pages[pid].nav + ' ' + tmp.textContent).replace(/\s+/g, ' ').trim() });
    $$('section.card', tmp).forEach(sx => { const h = $('h2', sx); INDEX.push({ page: pid, id: sx.id, title: h ? h.textContent : CFG.pages[pid].title, text: sx.textContent.replace(/\s+/g, ' ').trim() }); });
    $$('[data-s]', tmp).forEach(el => { if (el.id) INDEX.push({ page: pid, id: el.id, title: el.dataset.s.slice(0, 90), text: el.textContent.replace(/\s+/g, ' ').trim(), item: true }); });
  });
}
function searchRun(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return [];
  const out = [];
  INDEX.forEach(e => {
    const t = e.title.toLowerCase(), x = e.text.toLowerCase();
    if (!words.every(w => t.includes(w) || x.includes(w))) return;
    let sc = 0; words.forEach(w => { if (t.includes(w)) sc += 10; if (t.startsWith(w)) sc += 5; const i = x.indexOf(w); if (i >= 0) sc += Math.max(0, 5 - i / 200); });
    if (e.item) sc += 2; if (!e.id) sc -= 3;
    out.push({ e, sc });
  });
  out.sort((a, b) => b.sc - a.sc);
  const seen = new Set(), res = [];
  out.forEach(o => { const k = o.e.page + '#' + o.e.id; if (!seen.has(k) && res.length < 12) { seen.add(k); res.push(o.e); } });
  return res;
}
function snippet(text, words) {
  const low = text.toLowerCase(); let i = -1; for (const w of words) { i = low.indexOf(w); if (i >= 0) break; }
  const start = Math.max(0, i - 50), s = text.slice(start, start + 140);
  let h = esc((start ? '...' : '') + s + (start + 140 < text.length ? '...' : ''));
  words.forEach(w => { if (w.length > 1) h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return h;
}
function searchRender() {
  const q = $('#q').value.trim(), list = $('#sres');
  if (q.length < 2) { searchClose(); return; }
  searchHits = searchRun(q); searchActive = searchHits.length ? 0 : -1;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  list.innerHTML = searchHits.length ? searchHits.map((h, i) => `<li role="option" id="sr-${i}" aria-selected="${i === 0}" data-i="${i}"><span class="srt">${esc(h.title)}</span><span class="srp">${esc(CFG.pages[h.page].nav)}</span><span class="srs">${snippet(h.text, words)}</span></li>`).join('') : `<li class="srnone" role="option" aria-disabled="true">No results for "${esc(q)}". Try a shorter or different word.</li>`;
  list.hidden = false; $('#q').setAttribute('aria-expanded', 'true'); $('#q').setAttribute('aria-activedescendant', searchHits.length ? 'sr-0' : '');
  $('#search-status').textContent = searchHits.length ? `${searchHits.length} results. Use the arrow keys to choose.` : 'No results.';
}
function searchClose() { $('#sres').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); $('#q').removeAttribute('aria-activedescendant'); searchActive = -1; }
function searchMove(d) {
  if (!searchHits.length) return; searchActive = (searchActive + d + searchHits.length) % searchHits.length;
  $$('#sres [role="option"]').forEach((li, i) => li.setAttribute('aria-selected', i === searchActive ? 'true' : 'false'));
  const li = $('#sr-' + searchActive); $('#q').setAttribute('aria-activedescendant', 'sr-' + searchActive); if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
}
function searchGo(i) { const h = searchHits[i]; if (!h) return; searchClose(); $('#q').blur(); navigate(h.page, h.id); }

/* ---------------------------------------------------------------- modal, toast, copy */
function openModal(title, html) {
  const dlg = $('#modal'); $('#modal-title').textContent = title; $('#modal-body').innerHTML = html; modalOpener = document.activeElement;
  if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  $('#modal-close').focus();
}
function closeModal() {
  const dlg = $('#modal'); if (dlg.close && dlg.open) dlg.close(); else dlg.removeAttribute('open');
  if (modalOpener && modalOpener.focus && document.body.contains(modalOpener)) modalOpener.focus();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4000); }
function fallbackCopy(text) { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } ta.remove(); return ok; }
function copyText(text) {
  const done = ok => toast(ok ? 'Copied to the clipboard.' : 'Copy did not work in this browser. Select the text and copy it manually.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text))); else done(fallbackCopy(text));
}
function openTemplate(id) {
  const t = tplById(id); if (!t) return;
  openModal(t.name, `<p>${esc(t.purpose)}</p><pre class="tplbody">${esc(t.body)}</pre><p class="row"><button type="button" class="btn" data-copy-tpl="${t.id}">Copy text</button><button type="button" class="btn secondary" data-print-tpl="${t.id}">Print</button></p>`);
}

/* ---------------------------------------------------------------- global events */
function bindEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-copy-tpl],[data-print-tpl],[data-tpl-view],[data-kpi],[data-print-crit],[data-print-checklist],[data-show-gap],[data-show-ids],[data-print-page]');
    if (!t) return; const d = t.dataset;
    if (d.go) { e.preventDefault(); navigate(d.go, d.sec); }
    else if (d.copyTpl) { const x = tplById(d.copyTpl); if (x) copyText(x.body); }
    else if (d.printTpl) { const x = tplById(d.printTpl); if (x) printContent(x.name, `<pre class="tplbody">${esc(x.body)}</pre>`); }
    else if (d.tplView) openTemplate(d.tplView);
    else if (d.kpi) kpiModal(d.kpi);
    else if (d.printCrit) { const c = cycleById(d.printCrit), p = document.getElementById('crit-p-' + d.printCrit); printContent(`${CFG.program.name}: ${c.short} entry and exit criteria`, p ? p.innerHTML : ''); }
    else if (d.printChecklist) printContent(`${CFG.program.name}: UAT checklist`, CFG.guides.checklist.map(g => `<h3>${esc(g.group)}</h3><ul class="chk">${g.items.map(x => `<li><span class="box"></span>${esc(x)}</li>`).join('')}</ul>`).join('') + '<p>Name: ______________________ &nbsp; Date: ______________</p>');
    else if (d.showGap) showGap(d.showGap);
    else if (d.showIds) showIds(d.showIds);
    else if (d.printPage) window.print();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const dlg = $('#modal'); if (dlg.open || dlg.hasAttribute('open')) { e.preventDefault(); closeModal(); return; }
      if (!$('#sres').hidden) { searchClose(); }
      if (document.body.classList.contains('nav-open')) closeNav();
    }
  });
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
  $('#modal').addEventListener('close', () => { if (modalOpener && modalOpener.focus && document.body.contains(modalOpener)) modalOpener.focus(); });
  $('#modal-close').addEventListener('click', closeModal);
  $('#menu-btn').addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); $('#menu-btn').setAttribute('aria-expanded', open ? 'true' : 'false'); });
  $('#role').addEventListener('change', e => { S.role = e.target.value; renderRolePath(); });
  $('.skip').addEventListener('click', e => { e.preventDefault(); $('#page-title').focus(); });
  $('#nav').addEventListener('click', e => { if (e.target.closest('a')) closeNav(); });
  $('#rolepath').addEventListener('click', e => { if (e.target.closest('a')) closeNav(); });
  const q = $('#q');
  q.addEventListener('input', searchRender);
  q.addEventListener('focus', () => { if (q.value.trim().length >= 2) searchRender(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if ($('#sres').hidden) searchRender(); else searchMove(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); searchMove(-1); }
    else if (e.key === 'Enter') { if (!$('#sres').hidden && searchActive >= 0) { e.preventDefault(); searchGo(searchActive); } }
    else if (e.key === 'Escape') { searchClose(); }
  });
  $('#sres').addEventListener('mousedown', e => e.preventDefault());
  $('#sres').addEventListener('click', e => { const li = e.target.closest('[data-i]'); if (li) searchGo(Number(li.dataset.i)); });
  q.addEventListener('blur', () => setTimeout(searchClose, 150));
  window.addEventListener('hashchange', () => { if (!/^#\/[a-z]+/.test(location.hash) && location.hash !== '') return; const f = S.focusNext !== false; S.focusNext = true; route({ focus: f }); closeNav(); });
}

/* ---------------------------------------------------------------- boot */
function boot() {
  const raw = JSON.parse(document.getElementById('portal-config').textContent);
  loadConfig(raw); buildShell(); bindEvents(); buildIndex(); route({});
  if (/^https?:$/.test(location.protocol) && window.fetch) {
    fetch('portal-config.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
      if (j && j.program && Array.isArray(j.cycles)) { loadConfig(j); refreshAll(true); toast('Configuration loaded from portal-config.json.'); }
    }).catch(() => { });
  }
}
window.__portal = { S: S, cfg: () => CFG, PAGES: PAGES, MOUNT: MOUNT, route: route, search: q => searchRun(q), calcOutput: calcOutput, derived: derived, CHECKS: CHECKS, normalizeRows: normalizeRows, parseCSV: parseCSV, autoMap: autoMap, buildIndex: buildIndex, index: () => INDEX, loadConfig: loadConfig, resetSample: resetSample, navigate: navigate, refreshAll: refreshAll };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
